[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "autocrop-rs"
version = "0.1.0"
description = "Python bindings for the autocrop screenshot content-rectangle detector (Rust)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nachtalb" }]
keywords = ["image", "crop", "screenshot", "detection"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/Nachtalb/autocrop-rs"
Repository = "https://github.com/Nachtalb/autocrop-rs"
Issues = "https://github.com/Nachtalb/autocrop-rs/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "autocrop_rs"

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "numpy>=2.0",
    "pillow>=10.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

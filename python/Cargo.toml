[package]
name = "autocrop-py"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Python bindings for the autocrop screenshot content-rectangle detector."
license = "MIT"
publish = false

[lib]
name = "autocrop_rs"
crate-type = ["cdylib"]

[dependencies]
autocrop = { path = ".." }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
needless_pass_by_value = "allow"
